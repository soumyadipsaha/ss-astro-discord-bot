[project]
name = "vedic-discord-bot"
version = "0.1.0"
description = "Discord bot returning sidereal (Lahiri) Ascendant + Navagraha positions via Swiss Ephemeris, on Vercel."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "pysweph==2.10.3.6",
    "pynacl>=1.5",
    "httpx>=0.27",
    "resvg-py>=0.3.3",
    "geonamescache>=1.3",
]

[tool.uv]

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.30",
    "pytest>=8",
    "respx>=0.21",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
